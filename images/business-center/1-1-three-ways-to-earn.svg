<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Three ways to earn on Fanbase: Loves, Subscriptions, and Direct Content">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#2B0458"/>
    </linearGradient>
    <linearGradient id="loveCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1BAF"/>
      <stop offset="100%" stop-color="#FFA624"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg1)"/>

  <!-- Card 1: Loves -->
  <g transform="translate(80 80)">
    <rect width="320" height="240" rx="24" fill="url(#loveCard)" opacity="0.95"/>
    <circle cx="60" cy="60" r="32" fill="#FFFFFF" opacity="0.2"/>
    <path d="M 60 76 C 56 70 44 60 44 50 C 44 44 50 40 60 48 C 70 40 76 44 76 50 C 76 60 64 70 60 76 Z" fill="#FFFFFF"/>
    <text x="40" y="140" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Loves</text>
    <text x="40" y="170" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">Fan tips on posts,</text>
    <text x="40" y="190" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">live streams, Audio Rooms.</text>
    <text x="40" y="220" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1 Love = $0.005</text>
  </g>

  <!-- Card 2: Subscriptions -->
  <g transform="translate(440 80)">
    <rect width="320" height="240" rx="24" fill="#9824FF"/>
    <circle cx="60" cy="60" r="32" fill="#FFFFFF" opacity="0.2"/>
    <path d="M 45 55 L 75 55 M 45 60 L 70 60 M 50 70 A 10 10 0 1 0 70 70" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="40" y="140" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Subscriptions</text>
    <text x="40" y="170" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">Monthly recurring revenue</text>
    <text x="40" y="190" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">from your most loyal fans.</text>
    <text x="40" y="220" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">$0.99 – $49.99/mo</text>
  </g>

  <!-- Card 3: Direct Content -->
  <g transform="translate(800 80)">
    <rect width="320" height="240" rx="24" fill="#FF00D6"/>
    <circle cx="60" cy="60" r="32" fill="#FFFFFF" opacity="0.2"/>
    <rect x="48" y="48" width="24" height="24" rx="4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <text x="60" y="68" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
    <text x="40" y="140" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Direct</text>
    <text x="40" y="170" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">Premium unlocks through</text>
    <text x="40" y="190" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">Love-denominated actions.</text>
    <text x="40" y="220" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Exclusive content</text>
  </g>
</svg>
