<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Payment flow: fan to creator in five steps">
  <defs>
    <linearGradient id="bgFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#2B0458"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bgFlow)"/>

  <!-- Step pills with connecting line -->
  <line x1="120" y1="150" x2="1080" y2="150" stroke="#FF00D6" stroke-width="3" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Step 1: Fan pays -->
  <g transform="translate(80 100)">
    <circle cx="50" cy="50" r="44" fill="#FF1BAF"/>
    <circle cx="50" cy="40" r="10" fill="#FFFFFF"/>
    <path d="M 35 60 Q 50 50 65 60 L 65 70 L 35 70 Z" fill="#FFFFFF"/>
    <text x="50" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fan pays</text>
    <text x="50" y="148" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Loves or subscribe</text>
  </g>

  <!-- Step 2: Stripe -->
  <g transform="translate(280 100)">
    <circle cx="50" cy="50" r="44" fill="#9824FF"/>
    <rect x="32" y="38" width="36" height="24" rx="4" fill="#FFFFFF"/>
    <rect x="32" y="44" width="36" height="4" fill="#9824FF"/>
    <text x="50" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stripe</text>
    <text x="50" y="148" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Processes payment</text>
  </g>

  <!-- Step 3: Dashboard -->
  <g transform="translate(480 100)">
    <circle cx="50" cy="50" r="44" fill="#FF00D6"/>
    <rect x="32" y="36" width="36" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="38" y="52" width="6" height="8" fill="#FFFFFF"/>
    <rect x="46" y="48" width="6" height="12" fill="#FFFFFF"/>
    <rect x="54" y="44" width="6" height="16" fill="#FFFFFF"/>
    <text x="50" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dashboard</text>
    <text x="50" y="148" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Records earnings</text>
  </g>

  <!-- Step 4: Balance -->
  <g transform="translate(680 100)">
    <circle cx="50" cy="50" r="44" fill="#FF3F24"/>
    <rect x="32" y="38" width="36" height="24" rx="4" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="50" y="56" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
    <text x="50" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Balance grows</text>
    <text x="50" y="148" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">$5 min to cash out</text>
  </g>

  <!-- Step 5: Cashout -->
  <g transform="translate(880 100)">
    <circle cx="50" cy="50" r="44" fill="#FFA624"/>
    <path d="M 38 50 L 50 38 L 62 50 M 50 38 L 50 62" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="50" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cash out</text>
    <text x="50" y="148" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">To your PayPal</text>
  </g>

  <!-- Header -->
  <text x="600" y="50" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fan to creator, in 5 steps</text>
</svg>
