<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Follower to subscriber conversion funnel">
  <defs>
    <linearGradient id="funnelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#2B0458"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#funnelBg)"/>

  <text x="600" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">From stranger to subscriber.</text>
  <text x="600" y="76" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7" text-anchor="middle">The four stages every conversion moves through.</text>

  <!-- Funnel stages -->
  <!-- Stage 1: Awareness (widest) -->
  <g transform="translate(100 110)">
    <path d="M 0 0 L 1000 0 L 920 70 L 80 70 Z" fill="#9824FF" opacity="0.85"/>
    <text x="500" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">AWARENESS</text>
    <text x="500" y="56" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9" text-anchor="middle">Public Flickz and Posts pull new people in</text>
  </g>

  <!-- Stage 2: Engagement -->
  <g transform="translate(180 195)">
    <path d="M 0 0 L 840 0 L 760 70 L 80 70 Z" fill="#FF00D6" opacity="0.85"/>
    <text x="420" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">ENGAGEMENT</text>
    <text x="420" y="56" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9" text-anchor="middle">Stories, comments, Loves build the habit</text>
  </g>

  <!-- Stage 3: Trust -->
  <g transform="translate(260 280)">
    <path d="M 0 0 L 680 0 L 600 70 L 80 70 Z" fill="#FF1BAF" opacity="0.95"/>
    <text x="340" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRUST</text>
    <text x="340" y="56" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9" text-anchor="middle">Live moments and DMs prove you're real</text>
  </g>

  <!-- Stage 4: Conversion (narrowest) -->
  <g transform="translate(340 365)">
    <path d="M 0 0 L 520 0 L 440 70 L 80 70 Z" fill="#FFA624" opacity="0.95"/>
    <text x="260" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONVERSION</text>
    <text x="260" y="56" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.95" text-anchor="middle">The explicit subscribe ask, made repeatedly</text>
  </g>

  <text x="600" y="465" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.6" text-anchor="middle">Width = audience size at each stage</text>
</svg>
