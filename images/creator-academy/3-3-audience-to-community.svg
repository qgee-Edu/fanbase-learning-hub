<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="From audience to community: three concentric rings">
  <rect width="1200" height="500" fill="#1A0A2E"/>

  <text x="600" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Audience. Fans. Community.</text>
  <text x="600" y="76" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Most creators stop at audience. The work is moving people inward.</text>

  <!-- Concentric rings -->
  <g transform="translate(400 280)">
    <!-- Outer: Audience -->
    <circle cx="0" cy="0" r="180" fill="#9824FF" opacity="0.15" stroke="#9824FF" stroke-width="2"/>
    <!-- Middle: Fans -->
    <circle cx="0" cy="0" r="120" fill="#FF00D6" opacity="0.25" stroke="#FF00D6" stroke-width="2"/>
    <!-- Inner: Community -->
    <circle cx="0" cy="0" r="60" fill="#FFA624" opacity="0.6" stroke="#FFA624" stroke-width="2"/>

    <!-- Center text -->
    <text x="0" y="-5" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">community</text>
    <text x="0" y="12" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.9" text-anchor="middle">show up for each other</text>

    <text x="0" y="90" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">fans</text>
    <text x="0" y="105" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">subscribe to you</text>

    <text x="0" y="150" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">audience</text>
    <text x="0" y="165" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">watches you</text>
  </g>

  <!-- Right callouts -->
  <g transform="translate(700 130)">
    <rect width="420" height="100" rx="14" fill="#9824FF" opacity="0.1" stroke="#9824FF" stroke-opacity="0.5"/>
    <text x="20" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#C77DFF">Audience signals</text>
    <text x="20" y="58" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.85">High views. Low comments. Few Loves.</text>
    <text x="20" y="78" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.85">Profile visits without subscribes.</text>
  </g>

  <g transform="translate(700 250)">
    <rect width="420" height="120" rx="14" fill="#FFA624" opacity="0.15" stroke="#FFA624" stroke-opacity="0.5"/>
    <text x="20" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFA624">Community signals</text>
    <text x="20" y="58" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.85">Repeat commenters who know each other.</text>
    <text x="20" y="78" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.85">Audio Room regulars. Unprompted</text>
    <text x="20" y="98" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.85">recommendations. High Love-per-fan.</text>
  </g>
</svg>
