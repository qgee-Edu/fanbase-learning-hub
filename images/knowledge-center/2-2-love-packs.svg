<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-label="Love pack sizes available for fans to purchase">
  <defs>
    <linearGradient id="lovePacks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1BAF"/>
      <stop offset="50%" stop-color="#FF3F24"/>
      <stop offset="100%" stop-color="#FFA624"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="350" fill="#1A0A2E"/>

  <text x="600" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Love packs.</text>
  <text x="600" y="76" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Fans purchase Loves in packs and tip you across any content.</text>

  <!-- 6 pack tiles, sized to suggest the pack hierarchy -->
  <g transform="translate(80 110)">
    <!-- 100 -->
    <rect width="150" height="140" rx="16" fill="url(#lovePacks)" opacity="0.85"/>
    <path d="M 75 50 C 70 42 56 32 56 22 C 56 16 62 12 75 22 C 88 12 94 16 94 22 C 94 32 80 42 75 50 Z" fill="#FFFFFF"/>
    <text x="75" y="92" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">100</text>
    <text x="75" y="116" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9" text-anchor="middle">$0.50</text>
  </g>

  <g transform="translate(260 110)">
    <rect width="150" height="140" rx="16" fill="url(#lovePacks)" opacity="0.85"/>
    <path d="M 75 50 C 70 42 56 32 56 22 C 56 16 62 12 75 22 C 88 12 94 16 94 22 C 94 32 80 42 75 50 Z" fill="#FFFFFF"/>
    <text x="75" y="92" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">500</text>
    <text x="75" y="116" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9" text-anchor="middle">$2.50</text>
  </g>

  <g transform="translate(440 110)">
    <rect width="150" height="140" rx="16" fill="url(#lovePacks)" opacity="0.95"/>
    <path d="M 75 50 C 70 42 56 32 56 22 C 56 16 62 12 75 22 C 88 12 94 16 94 22 C 94 32 80 42 75 50 Z" fill="#FFFFFF"/>
    <text x="75" y="92" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1,000</text>
    <text x="75" y="116" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9" text-anchor="middle">$5.00</text>
  </g>

  <g transform="translate(620 110)">
    <rect width="150" height="140" rx="16" fill="url(#lovePacks)" opacity="0.95"/>
    <path d="M 75 50 C 70 42 56 32 56 22 C 56 16 62 12 75 22 C 88 12 94 16 94 22 C 94 32 80 42 75 50 Z" fill="#FFFFFF"/>
    <text x="75" y="92" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,500</text>
    <text x="75" y="116" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9" text-anchor="middle">$12.50</text>
  </g>

  <g transform="translate(800 110)">
    <rect width="150" height="140" rx="16" fill="url(#lovePacks)"/>
    <path d="M 75 50 C 70 42 56 32 56 22 C 56 16 62 12 75 22 C 88 12 94 16 94 22 C 94 32 80 42 75 50 Z" fill="#FFFFFF"/>
    <text x="75" y="92" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">10,000</text>
    <text x="75" y="116" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9" text-anchor="middle">$50.00</text>
  </g>

  <g transform="translate(980 110)">
    <rect width="150" height="140" rx="16" fill="url(#lovePacks)"/>
    <path d="M 75 50 C 70 42 56 32 56 22 C 56 16 62 12 75 22 C 88 12 94 16 94 22 C 94 32 80 42 75 50 Z" fill="#FFFFFF"/>
    <text x="75" y="92" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">25,000</text>
    <text x="75" y="116" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9" text-anchor="middle">$125.00</text>
  </g>

  <text x="600" y="290" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.65" text-anchor="middle">1 Love = $0.005 (half a penny). Fans can also send any amount, from 1 to 25,000 at once.</text>
</svg>
