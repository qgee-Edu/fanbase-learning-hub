<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Fanbase Support Center hero: three hubs unified by the Fanbase lightning bolt">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B0458"/>
      <stop offset="55%" stop-color="#841AC8"/>
      <stop offset="100%" stop-color="#871951"/>
    </linearGradient>
    <linearGradient id="loveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1BAF"/>
      <stop offset="55%" stop-color="#FF3F24"/>
      <stop offset="100%" stop-color="#FFA624"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGrad)"/>

  <!-- ambient glow circles -->
  <circle cx="180" cy="120" r="180" fill="#FF00D6" opacity="0.18"/>
  <circle cx="1050" cy="480" r="200" fill="#9824FF" opacity="0.22"/>
  <circle cx="600" cy="320" r="140" fill="#FF1BAF" opacity="0.10"/>

  <!-- giant lightning bolt centerpiece -->
  <g transform="translate(600 300)">
    <path d="M -30 -160 L 50 -160 L 10 -20 L 70 -20 L -50 160 L -10 30 L -70 30 Z"
          fill="url(#loveGrad)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- three orbit cards: business / knowledge / academy -->
  <g transform="translate(140 420)">
    <rect width="240" height="120" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="40" cy="40" r="18" fill="#FF00D6"/>
    <text x="40" y="46" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
    <text x="70" y="46" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Business</text>
    <text x="20" y="84" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">Get paid. Cash out.</text>
  </g>

  <g transform="translate(480 460)">
    <rect width="240" height="120" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="40" cy="40" r="18" fill="#9824FF"/>
    <path d="M 30 36 L 50 36 M 30 44 L 50 44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="46" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Knowledge</text>
    <text x="20" y="84" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">Master every feature.</text>
  </g>

  <g transform="translate(820 420)">
    <rect width="240" height="120" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="40" cy="40" r="18" fill="#FF1BAF"/>
    <path d="M 32 40 L 40 32 L 48 40 L 40 48 Z" fill="#FFFFFF"/>
    <text x="70" y="46" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Academy</text>
    <text x="20" y="84" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">Earn and grow.</text>
  </g>

  <!-- tagline -->
  <text x="600" y="130" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">build your creator business.</text>
  <text x="600" y="170" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.85">three hubs. one platform. earn from day one.</text>
</svg>
