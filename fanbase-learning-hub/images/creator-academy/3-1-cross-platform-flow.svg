<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Cross-platform flow: discovery channels feed Fanbase as the monetization hub">
  <rect width="1200" height="400" fill="#1A0A2E"/>

  <text x="600" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Discovery elsewhere. Revenue here.</text>
  <text x="600" y="76" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Most creators only need two platforms: one for reach, one for revenue.</text>

  <!-- Discovery sources (left) -->
  <g transform="translate(80 140)">
    <rect width="220" height="56" rx="14" fill="#9824FF" opacity="0.25" stroke="#9824FF" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">TikTok</text>
    <text x="20" y="48" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">Short-form discovery</text>
  </g>

  <g transform="translate(80 220)">
    <rect width="220" height="56" rx="14" fill="#FF00D6" opacity="0.25" stroke="#FF00D6" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Instagram</text>
    <text x="20" y="48" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">Stories + Reels</text>
  </g>

  <g transform="translate(80 300)">
    <rect width="220" height="56" rx="14" fill="#FF1BAF" opacity="0.25" stroke="#FF1BAF" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">YouTube</text>
    <text x="20" y="48" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">Long-form content</text>
  </g>

  <!-- Arrows -->
  <path d="M 320 168 Q 500 168 700 250" stroke="#FFA624" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 320 248 L 700 250" stroke="#FFA624" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 320 328 Q 500 328 700 250" stroke="#FFA624" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Fanbase hub (right) -->
  <g transform="translate(720 160)">
    <rect width="380" height="200" rx="24" fill="url(#hubGrad)" stroke="#FFA624" stroke-width="2"/>
    <defs>
      <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FF1BAF" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFA624" stop-opacity="0.4"/>
      </linearGradient>
    </defs>
    <!-- bolt -->
    <g transform="translate(50 60)">
      <path d="M 0 -30 L 16 -30 L 6 0 L 24 0 L -8 40 L 2 10 L -16 10 Z" fill="#FFA624"/>
    </g>
    <text x="100" y="60" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Fanbase</text>
    <text x="100" y="90" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">The monetization hub</text>

    <text x="40" y="140" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">→ Convert followers to subscribers</text>
    <text x="40" y="162" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">→ Loves from live moments</text>
    <text x="40" y="184" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">→ Recurring monthly revenue</text>
  </g>
</svg>
