<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Responsible Influence: four pillars">
  <rect width="1200" height="400" fill="#1A0A2E"/>

  <text x="600" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Responsible Influence.</text>
  <text x="600" y="76" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Four pillars for using your reach with care.</text>

  <!-- Pillar 1: Intentionality -->
  <g transform="translate(80 120)">
    <rect width="240" height="220" rx="20" fill="#9824FF" opacity="0.2" stroke="#9824FF" stroke-width="2"/>
    <circle cx="120" cy="60" r="30" fill="#9824FF"/>
    <circle cx="120" cy="60" r="14" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="120" cy="60" r="6" fill="#FFFFFF"/>
    <text x="120" y="130" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#C77DFF" text-anchor="middle">Intentionality</text>
    <text x="120" y="162" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">What you're trying</text>
    <text x="120" y="178" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">to put into the world.</text>
  </g>

  <!-- Pillar 2: Honesty -->
  <g transform="translate(340 120)">
    <rect width="240" height="220" rx="20" fill="#FF00D6" opacity="0.2" stroke="#FF00D6" stroke-width="2"/>
    <circle cx="120" cy="60" r="30" fill="#FF00D6"/>
    <path d="M 108 58 L 118 68 L 134 52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="120" y="130" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FF00D6" text-anchor="middle">Honesty</text>
    <text x="120" y="162" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">Disclose sponsorships,</text>
    <text x="120" y="178" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">never deceive your fans.</text>
  </g>

  <!-- Pillar 3: Care -->
  <g transform="translate(600 120)">
    <rect width="240" height="220" rx="20" fill="#FF1BAF" opacity="0.2" stroke="#FF1BAF" stroke-width="2"/>
    <circle cx="120" cy="60" r="30" fill="#FF1BAF"/>
    <path d="M 120 76 C 114 70 102 62 102 52 C 102 46 108 42 120 50 C 132 42 138 46 138 52 C 138 62 126 70 120 76 Z" fill="#FFFFFF"/>
    <text x="120" y="130" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FF1BAF" text-anchor="middle">Care</text>
    <text x="120" y="162" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">Your community is</text>
    <text x="120" y="178" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">made of real people.</text>
  </g>

  <!-- Pillar 4: Accountability -->
  <g transform="translate(860 120)">
    <rect width="240" height="220" rx="20" fill="#FFA624" opacity="0.2" stroke="#FFA624" stroke-width="2"/>
    <circle cx="120" cy="60" r="30" fill="#FFA624"/>
    <rect x="106" y="46" width="28" height="28" rx="3" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <path d="M 113 56 L 120 64 L 130 50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="120" y="130" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFA624" text-anchor="middle">Accountability</text>
    <text x="120" y="162" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">Own your mistakes.</text>
    <text x="120" y="178" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8" text-anchor="middle">Address them in public.</text>
  </g>
</svg>
