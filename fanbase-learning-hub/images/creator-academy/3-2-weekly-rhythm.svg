<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A sustainable weekly content rhythm">
  <rect width="1200" height="400" fill="#1A0A2E"/>

  <text x="600" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">A sustainable weekly rhythm.</text>
  <text x="600" y="76" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Consistency beats volume. Don't drop below this floor.</text>

  <!-- Day columns -->
  <g transform="translate(80 110)">
    <text x="500" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.6" text-anchor="middle">MON   TUE   WED   THU   FRI   SAT   SUN</text>
  </g>

  <!-- Daily row: Flickz + Stories -->
  <g transform="translate(80 140)">
    <rect width="220" height="58" rx="12" fill="#FF1BAF" opacity="0.15" stroke="#FF1BAF" stroke-width="1"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FF1BAF">Daily</text>
    <text x="20" y="46" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Flickz + Stories</text>

    <g transform="translate(240 0)">
      <circle cx="20" cy="29" r="14" fill="#FF1BAF"/>
      <circle cx="70" cy="29" r="14" fill="#FF1BAF"/>
      <circle cx="120" cy="29" r="14" fill="#FF1BAF"/>
      <circle cx="170" cy="29" r="14" fill="#FF1BAF"/>
      <circle cx="220" cy="29" r="14" fill="#FF1BAF"/>
      <circle cx="270" cy="29" r="14" fill="#FF1BAF"/>
      <circle cx="320" cy="29" r="14" fill="#FF1BAF"/>
    </g>
  </g>

  <!-- Weekly row: Post + Live -->
  <g transform="translate(80 210)">
    <rect width="220" height="58" rx="12" fill="#9824FF" opacity="0.15" stroke="#9824FF" stroke-width="1"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#C77DFF">Weekly</text>
    <text x="20" y="46" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Signature Post + Live</text>

    <g transform="translate(240 0)">
      <rect x="6" y="15" width="28" height="28" rx="6" fill="#9824FF"/>
      <text x="20" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
      <rect x="306" y="15" width="28" height="28" rx="6" fill="#FF3F24"/>
      <text x="320" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
    </g>
  </g>

  <!-- Bi-weekly row: Audio Room -->
  <g transform="translate(80 280)">
    <rect width="220" height="58" rx="12" fill="#FFA624" opacity="0.15" stroke="#FFA624" stroke-width="1"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFA624">Every 2 wks</text>
    <text x="20" y="46" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Audio Room</text>

    <g transform="translate(240 0)">
      <rect x="106" y="15" width="28" height="28" rx="6" fill="#FFA624"/>
      <text x="120" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
    </g>
  </g>

  <!-- Footer summary card -->
  <g transform="translate(840 140)">
    <rect width="280" height="210" rx="16" fill="#FF00D6" opacity="0.15" stroke="#FF00D6" stroke-width="1.5"/>
    <text x="20" y="40" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FF00D6">Sustainability rule</text>
    <text x="20" y="74" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">If you can't keep this up for</text>
    <text x="20" y="92" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">4 weeks straight, cut it in half.</text>
    <text x="20" y="124" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">A creator posting 3 Stories a day</text>
    <text x="20" y="142" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">for 90 days will outperform a</text>
    <text x="20" y="160" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">creator who posts 10 things in</text>
    <text x="20" y="178" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.9">week one and disappears.</text>
  </g>
</svg>
