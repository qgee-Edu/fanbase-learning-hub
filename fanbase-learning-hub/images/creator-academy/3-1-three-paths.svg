<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Three monetization paths: tip-driven, subscription-driven, hybrid">
  <rect width="1200" height="400" fill="#1A0A2E"/>

  <text x="600" y="45" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pick the path that fits your content.</text>

  <!-- Tip-Driven -->
  <g transform="translate(80 100)">
    <rect width="320" height="260" rx="20" fill="#FF1BAF" opacity="0.15" stroke="#FF1BAF" stroke-width="2"/>
    <circle cx="60" cy="60" r="28" fill="#FF1BAF"/>
    <path d="M 60 78 C 56 72 44 62 44 52 C 44 46 50 42 60 50 C 70 42 76 46 76 52 C 76 62 64 72 60 78 Z" fill="#FFFFFF"/>
    <text x="40" y="125" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FF1BAF">Tip-Driven</text>

    <!-- bar chart showing revenue mix -->
    <rect x="40" y="150" width="240" height="14" rx="7" fill="#FFFFFF" opacity="0.1"/>
    <rect x="40" y="150" width="200" height="14" rx="7" fill="#FF1BAF"/>
    <text x="40" y="184" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Loves do most of the work</text>

    <text x="40" y="218" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">Live often, host Audio Rooms,</text>
    <text x="40" y="236" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">real-time moments fans celebrate.</text>
  </g>

  <!-- Subscription-Driven -->
  <g transform="translate(440 100)">
    <rect width="320" height="260" rx="20" fill="#9824FF" opacity="0.15" stroke="#9824FF" stroke-width="2"/>
    <circle cx="60" cy="60" r="28" fill="#9824FF"/>
    <path d="M 46 56 L 76 56 M 46 60 L 70 60 M 50 70 A 10 10 0 1 0 70 70" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="40" y="125" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#C77DFF">Subscription</text>

    <rect x="40" y="150" width="240" height="14" rx="7" fill="#FFFFFF" opacity="0.1"/>
    <rect x="40" y="150" width="210" height="14" rx="7" fill="#9824FF"/>
    <text x="40" y="184" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Recurring revenue does the work</text>

    <text x="40" y="218" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">Ongoing exclusive content worth</text>
    <text x="40" y="236" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">committing to monthly.</text>
  </g>

  <!-- Hybrid -->
  <g transform="translate(800 100)">
    <rect width="320" height="260" rx="20" fill="#FFA624" opacity="0.15" stroke="#FFA624" stroke-width="2"/>
    <circle cx="60" cy="60" r="28" fill="#FFA624"/>
    <path d="M 44 60 L 52 52 L 60 60 L 68 52 L 76 60" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="40" y="125" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFA624">Hybrid</text>

    <rect x="40" y="150" width="240" height="14" rx="7" fill="#FFFFFF" opacity="0.1"/>
    <rect x="40" y="150" width="120" height="14" rx="7" fill="#FF1BAF"/>
    <rect x="160" y="150" width="100" height="14" rx="7" fill="#9824FF"/>
    <text x="40" y="184" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85">Loves + Subscriptions both pull</text>

    <text x="40" y="218" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">Most stable model. Public for</text>
    <text x="40" y="236" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">discovery, exclusive for revenue.</text>
  </g>
</svg>
