<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Business Center hub: payments and finance for Fanbase creators">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B0458"/>
      <stop offset="100%" stop-color="#871951"/>
    </linearGradient>
    <linearGradient id="loveBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1BAF"/>
      <stop offset="50%" stop-color="#FF3F24"/>
      <stop offset="100%" stop-color="#FFA624"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="120" fill="#FF00D6" opacity="0.15"/>
  <circle cx="1100" cy="320" r="160" fill="#9824FF" opacity="0.20"/>

  <!-- Dashboard mockup card -->
  <g transform="translate(700 70)">
    <rect width="420" height="260" rx="24" fill="#FFFFFF" opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="30" y="50" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.75">Total balance</text>
    <text x="30" y="100" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">$4,287.50</text>

    <!-- Mini bars -->
    <rect x="30" y="140" width="60" height="80" rx="8" fill="url(#loveBar)" opacity="0.9"/>
    <rect x="100" y="160" width="60" height="60" rx="8" fill="#FF00D6" opacity="0.7"/>
    <rect x="170" y="130" width="60" height="90" rx="8" fill="#9824FF" opacity="0.8"/>
    <rect x="240" y="120" width="60" height="100" rx="8" fill="url(#loveBar)" opacity="0.9"/>
    <rect x="310" y="150" width="60" height="70" rx="8" fill="#FF1BAF" opacity="0.7"/>

    <text x="60" y="240" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Mon</text>
    <text x="130" y="240" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Tue</text>
    <text x="200" y="240" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Wed</text>
    <text x="270" y="240" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Thu</text>
    <text x="340" y="240" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Fri</text>
  </g>

  <!-- Heading -->
  <text x="80" y="140" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FF00D6" opacity="0.9">Business Center</text>
  <text x="80" y="200" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">payments &amp; finance.</text>
  <text x="80" y="250" font-family="Inter, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.85">how money moves on Fanbase.</text>

  <!-- Lightning bolt accent -->
  <g transform="translate(80 290)">
    <path d="M 0 0 L 20 0 L 10 30 L 28 30 L -2 70 L 8 40 L -10 40 Z" fill="url(#loveBar)"/>
  </g>
</svg>
