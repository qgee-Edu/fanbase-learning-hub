<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Public versus exclusive content: discovery versus subscriber value">
  <defs>
    <linearGradient id="pubBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9824FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9824FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="excBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1BAF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA624" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#1A0A2E"/>

  <!-- PUBLIC -->
  <g transform="translate(80 60)">
    <rect width="480" height="280" rx="24" fill="url(#pubBg)" stroke="#9824FF" stroke-width="2"/>
    <circle cx="60" cy="60" r="28" fill="#9824FF"/>
    <path d="M 46 60 C 46 50 76 50 76 60 C 76 70 46 70 46 60 Z M 56 60 A 5 5 0 1 1 66 60 A 5 5 0 1 1 56 60 Z" fill="#FFFFFF"/>
    <text x="110" y="55" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#C77DFF" opacity="0.95">PUBLIC CONTENT</text>
    <text x="110" y="80" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">growth.</text>

    <text x="40" y="140" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Anyone on Fanbase can view</text>
    <text x="40" y="170" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Drives discovery and follows</text>
    <text x="40" y="200" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Best for teasers and free value</text>
    <text x="40" y="230" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Earns indirectly via Loves</text>

    <rect x="40" y="252" width="120" height="18" rx="9" fill="#9824FF" opacity="0.5"/>
    <text x="100" y="265" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE TO VIEW</text>
  </g>

  <!-- EXCLUSIVE -->
  <g transform="translate(640 60)">
    <rect width="480" height="280" rx="24" fill="url(#excBg)" stroke="#FF00D6" stroke-width="2"/>
    <circle cx="60" cy="60" r="28" fill="#FF00D6"/>
    <rect x="50" y="50" width="20" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="54" y="44" width="12" height="10" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="110" y="55" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFA624" opacity="0.95">EXCLUSIVE CONTENT</text>
    <text x="110" y="80" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">revenue.</text>

    <text x="40" y="140" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Only paid subscribers can view</text>
    <text x="40" y="170" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Unlocks when a fan subscribes</text>
    <text x="40" y="200" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Best for premium &amp; BTS content</text>
    <text x="40" y="230" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">• Earns monthly recurring revenue</text>

    <rect x="40" y="252" width="150" height="18" rx="9" fill="#FF1BAF" opacity="0.7"/>
    <text x="115" y="265" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SUBSCRIPTION REQUIRED</text>
  </g>
</svg>
